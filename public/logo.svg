<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" width="100%" height="100%">
  <defs>
    <linearGradient id="wg-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="wg-maroon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
  </defs>

  <!-- W Splash & Stylized Vector Icon -->
  <g transform="translate(10, 10)">
    <!-- Splash Dots -->
    <circle cx="12" cy="18" r="7" fill="#7f1d1d" />
    <circle cx="28" cy="24" r="9" fill="#991b1b" />
    <circle cx="18" cy="40" r="5" fill="#dc2626" />
    <circle cx="34" cy="50" r="8" fill="#7f1d1d" />
    <circle cx="20" cy="62" r="6" fill="#b91c1c" />
    <circle cx="36" cy="74" r="5" fill="#991b1b" />
    <circle cx="48" cy="82" r="4" fill="#dc2626" />

    <!-- Splash Liquid Wave behind left stroke -->
    <path d="M25,12 C40,5 50,25 45,45 C40,65 55,80 40,88 C30,85 20,70 25,12 Z" fill="#b91c1c" />

    <!-- Left Maroon Arm of W -->
    <path d="M42,12 L65,75 C67,80 73,80 76,75 L92,30 C94,25 99,25 102,30 L118,75 C121,80 127,80 129,75 L145,12" 
          fill="none" stroke="url(#wg-maroon-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Overlapping Bright Red Front Arm of W -->
    <path d="M52,10 L78,82 L100,24 L122,82 L148,10" 
          fill="none" stroke="url(#wg-red-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <!-- WARS (Red) -->
  <text x="160" y="62" font-family="'Prompt', 'Inter', sans-serif" font-weight="800" font-size="44" fill="#dc2626" letter-spacing="-0.5">WARS</text>
  
  <!-- GATE (Black / High Contrast) -->
  <text x="282" y="62" font-family="'Prompt', 'Inter', sans-serif" font-weight="800" font-size="44" fill="#1e293b" letter-spacing="-0.5" class="wg-gate-text">GATE</text>
  
  <!-- AUTOMATION (Metallic Grey) -->
  <text x="162" y="88" font-family="'Prompt', 'Inter', sans-serif" font-weight="600" font-size="19" fill="#64748b" letter-spacing="4">AUTOMATION</text>
</svg>
